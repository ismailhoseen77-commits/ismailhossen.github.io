<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mihadx BD</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-page">
    <div class="login-card" style="max-width: 400px; margin: 100px auto; background: #1e293b; padding: 30px; border-radius: 8px; text-align: center;">
        <h2>Mihadx BD Login</h2>
        <p style="color: #94a3b8; margin-bottom: 20px;">আপনার গুগল অ্যাকাউন্ট দিয়ে সিকিউরলি লগইন করুন।</p>
        <button id="google-login-btn" class="google-btn" style="background: #fff; color: #000; border: none; padding: 12px 20px; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%;">
            <i class="fa-brands fa-google" style="color: #ea4335; margin-right: 8px;"></i> Continue with Google
        </button>
        <div id="login-error" class="error-msg" style="color: #ef4444; margin-top: 15px;"></div>
    </div>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
