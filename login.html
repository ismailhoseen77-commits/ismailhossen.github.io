<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - MIHADX PRO BD</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style> body { font-family: 'Hind Siliguri', sans-serif; } </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-6">
    <div class="text-center space-y-1">
      <h1 class="text-xl font-bold text-orange-500">MIHADX PRO BD</h1>
      <p class="text-xs text-slate-400">আপনার অ্যাকাউন্টে লগইন করুন</p>
    </div>

    <!-- Email/Password Form -->
    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-xs text-slate-300 mb-1 font-medium">ইমেইল ঠিকানা</label>
        <input type="email" id="login-email" placeholder="example@gmail.com" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-orange-500" required>
      </div>
      <div>
        <label class="block text-xs text-slate-300 mb-1 font-medium">পাসওয়ার্ড</label>
        <input type="password" id="login-password" placeholder="********" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-orange-500" required>
      </div>
      <button type="submit" class="w-full bg-orange-600 hover:bg-orange-700 text-white py-3 rounded-xl font-bold text-xs transition-all shadow">
        লগইন করুন
      </button>
    </form>

    <div class="relative flex py-2 items-center">
      <div class="flex-grow border-t border-slate-700"></div>
      <span class="flex-shrink mx-4 text-slate-500 text-[10px]">অথবা</span>
      <div class="flex-grow border-t border-slate-700"></div>
    </div>

    <!-- Google Login Button -->
    <button id="google-login-btn" class="w-full bg-slate-700 hover:bg-slate-600 text-white py-3 rounded-xl font-bold text-xs transition-all flex items-center justify-center gap-2 shadow border border-slate-600">
      <i class="fa-brands fa-google text-red-400"></i> গুগল দিয়ে লগইন করুন
    </button>
  </div>

  <!-- Firebase Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyACc83rBZjnoZ8l-pZFIRqSs-fyVoiN6ck",
      authDomain: "mihadx-pro-bd.firebaseapp.com",
      projectId: "mihadx-pro-bd",
      storageBucket: "mihadx-pro-bd.firebasestorage.app",
      messagingSenderId: "478391400367",
      appId: "1:478391400367:web:86012d35014ee7350a215a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const googleProvider = new GoogleAuthProvider();

    // আপনার নির্দিষ্ট এডমিন জিমেইল
    const ADMIN_EMAIL = "ismailhoseen77@gmail.com";

    // স্মার্ট রিডাইরেক্ট ফাংশন (কে এডমিন আর কে ইউজার তা যাচাই করবে)
    function handleRedirect(user) {
      if (user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
        alert("এডমিন হিসেবে সফলভাবে লগইন হয়েছে!");
        window.location.href = "admin.html"; // এডমিন প্যানেলে পাঠাবে
      } else {
        alert("সফলভাবে লগইন হয়েছে!");
        window.location.href = "index.html"; // সাধারণ ইউজার পেজে পাঠাবে
      }
    }

    // Email/Password Login Handler
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        handleRedirect(userCredential.user);
      } catch (error) {
        alert("লগইন করতে সমস্যা হয়েছে: " + error.message);
      }
    });

    // Google Login Handler
    document.getElementById('google-login-btn').addEventListener('click', async () => {
      try {
        const result = await signInWithPopup(auth, googleProvider);
        handleRedirect(result.user);
      } catch (error) {
        alert("গুগল লগইন ব্যর্থ হয়েছে: " + error.message);
      }
    });
  </script>
</body>
</html>
