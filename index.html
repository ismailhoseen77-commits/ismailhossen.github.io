<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mihadx BD Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-100 text-gray-800 pb-20">

    <!-- Header -->
    <header class="bg-indigo-600 text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-40">
        <h1 class="text-xl font-black tracking-wide">MIHADX BD</h1>
        <div id="user-auth-btn">
            <button onclick="loginWithGoogle()" class="bg-white text-indigo-600 px-3 py-1.5 rounded-full text-xs font-bold shadow flex items-center gap-1">
                <i class="fa-brands fa-google"></i> Login
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-md mx-auto p-4 space-y-6">

        <!-- Top Up Section -->
        <section class="bg-white p-4 rounded-2xl shadow-sm">
            <h2 class="text-sm font-bold text-gray-700 mb-3 border-b pb-2"><i class="fa-solid fa-gamepad text-indigo-600 mr-2"></i>Top Up Center</h2>
            <div class="grid grid-cols-2 gap-3">
                <div onclick="openTopupModal('efootball')" class="bg-gray-50 border rounded-xl p-3 flex flex-col items-center cursor-pointer hover:border-indigo-600 transition">
                    <img src="EFootball_logo.png" class="w-12 h-12 rounded-lg mb-2 object-cover" onerror="this.src='https://i.ibb.co/3s3W98t/efootball.png'">
                    <span class="text-xs font-bold">E-Football Coin</span>
                </div>
                <div onclick="openTopupModal('freefire')" class="bg-gray-50 border rounded-xl p-3 flex flex-col items-center cursor-pointer hover:border-indigo-600 transition">
                    <img src="free-fire-logo.png" class="w-12 h-12 rounded-lg mb-2 object-cover" onerror="this.src='https://i.ibb.co/4gW8H5p/freefire.png'">
                    <span class="text-xs font-bold">Free Fire Diamond</span>
                </div>
            </div>
        </section>

        <!-- Computer Work Section -->
        <section class="bg-white p-4 rounded-2xl shadow-sm">
            <h2 class="text-sm font-bold text-gray-700 mb-3 border-b pb-2"><i class="fa-solid fa-laptop-code text-indigo-600 mr-2"></i>Computer Work</h2>
            <div class="grid grid-cols-2 gap-2 text-xs">
                <button onclick="openCompModal('MS Word')" class="bg-blue-50 border border-blue-200 text-blue-700 p-3 rounded-xl font-bold flex items-center justify-center gap-1.5"><i class="fa-regular fa-file-word text-base"></i> MS Word</button>
                <button onclick="openCompModal('MS Excel')" class="bg-emerald-50 border border-emerald-200 text-emerald-700 p-3 rounded-xl font-bold flex items-center justify-center gap-1.5"><i class="fa-regular fa-file-excel text-base"></i> MS Excel</button>
                <button onclick="openCompModal('MS Powerpoint')" class="bg-orange-50 border border-orange-200 text-orange-700 p-3 rounded-xl font-bold flex items-center justify-center gap-1.5"><i class="fa-regular fa-file-powerpoint text-base"></i> Powerpoint</button>
                <button onclick="openCompModal('Data Entry')" class="bg-purple-50 border border-purple-200 text-purple-700 p-3 rounded-xl font-bold flex items-center justify-center gap-1.5"><i class="fa-solid fa-database text-base"></i> Data Entry</button>
            </div>
        </section>

    </main>

    <!-- Floating Support Widget (WhatsApp & AI) -->
    <div class="fixed bottom-20 right-4 z-50 flex flex-col gap-2">
        <a id="wa-btn" href="https://wa.me/8801576502490" target="_blank" class="bg-emerald-500 text-white w-11 h-11 rounded-full flex items-center justify-center shadow-lg text-xl"><i class="fa-brands fa-whatsapp"></i></a>
        <button onclick="toggleAiWidget()" class="bg-indigo-600 text-white w-11 h-11 rounded-full flex items-center justify-center shadow-lg text-xl"><i class="fa-solid fa-robot"></i></button>
    </div>

    <!-- AI Assistant Box -->
    <div id="ai-widget" class="fixed bottom-36 right-4 w-72 bg-white rounded-2xl shadow-2xl border hidden z-50 overflow-hidden text-xs">
        <div class="bg-indigo-600 text-white p-3 font-bold flex justify-between items-center">
            <span><i class="fa-solid fa-bot mr-1"></i> Mihadx AI Support</span>
            <button onclick="toggleAiWidget()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="ai-messages" class="h-48 p-3 overflow-y-auto space-y-2 bg-gray-50">
            <div class="bg-indigo-100 p-2 rounded-lg text-indigo-900">আসসালামু আলাইকুম! টপ-আপ বা আমাদের সার্ভিস নিয়ে যেকোনো প্রশ্ন করুন।</div>
        </div>
        <div class="p-2 border-t flex gap-1 bg-white">
            <input type="text" id="ai-input" placeholder="আপনার প্রশ্ন লিখুন..." class="w-full border rounded-lg p-1.5 text-xs outline-none">
            <button onclick="askAi()" class="bg-indigo-600 text-white px-3 py-1.5 rounded-lg font-bold">Send</button>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t py-2.5 px-8 flex justify-between items-center max-w-md mx-auto z-40 shadow-lg">
        <a href="index.html" class="flex flex-col items-center text-indigo-600">
            <i class="fa-solid fa-house text-lg"></i>
            <span class="text-[10px] font-bold mt-0.5">Home</span>
        </a>
        <a href="track.html" class="flex flex-col items-center text-gray-400 hover:text-indigo-600">
            <i class="fa-solid fa-bag-shopping text-lg"></i>
            <span class="text-[10px] font-bold mt-0.5">My Orders</span>
        </a>
        <a href="login.html" class="flex flex-col items-center text-gray-400 hover:text-indigo-600">
            <i class="fa-solid fa-user text-lg"></i>
            <span class="text-[10px] font-bold mt-0.5">Profile</span>
        </a>
    </nav>

    <!-- Top-Up Order Modal -->
    <div id="topup-modal" class="fixed inset-0 bg-black/70 hidden items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-md rounded-2xl p-5 relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeModals()" class="absolute top-3 right-3 text-gray-500"><i class="fa-solid fa-xmark text-xl"></i></button>
            <h3 id="topup-title" class="font-bold text-lg mb-3 border-b pb-2">Top-Up</h3>
            
            <div id="package-list" class="grid grid-cols-2 gap-2 mb-4"></div>

            <div class="space-y-3">
                <div>
                    <label class="text-xs font-bold text-gray-600">Player UID / Konami Mail & Pass:</label>
                    <input type="text" id="player-id" class="w-full border rounded-lg p-2 text-sm mt-1 focus:outline-none focus:border-indigo-600" placeholder="UID or Konami details">
                </div>

                <div class="bg-pink-50 border border-pink-200 p-3 rounded-xl text-xs space-y-2 text-pink-900">
                    <p class="font-bold">bKash Personal Send Money:</p>
                    <div class="bg-white p-2 rounded border flex justify-between items-center font-mono font-bold text-sm">
                        <span id="bkash-num">01309735129</span>
                        <button onclick="navigator.clipboard.writeText('01309735129'); alert('কপি হয়েছে!');" class="bg-pink-600 text-white text-[10px] px-2 py-1 rounded">Copy</button>
                    </div>
                    <div>
                        <label class="font-bold">TrxID:</label>
                        <input type="text" id="trx-id" class="w-full border rounded p-1.5 text-sm mt-1 text-gray-800" placeholder="e.g. 9L78XXX">
                    </div>
                </div>

                <button onclick="submitTopupOrder()" class="w-full bg-indigo-600 text-white font-bold py-2.5 rounded-xl text-sm shadow">Verify & Order</button>
            </div>
        </div>
    </div>

    <!-- Computer Work Modal -->
    <div id="comp-modal" class="fixed inset-0 bg-black/70 hidden items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-sm rounded-2xl p-5 relative">
            <button onclick="closeModals()" class="absolute top-3 right-3 text-gray-500"><i class="fa-solid fa-xmark text-xl"></i></button>
            <h3 id="comp-title" class="font-bold text-lg mb-3 border-b pb-2 text-indigo-600">Computer Work</h3>
            <div class="space-y-3 text-xs">
                <textarea id="comp-details" rows="4" class="w-full border rounded-lg p-2 text-sm outline-none" placeholder="কাজের বিস্তারিত বিবরণ লিখুন..."></textarea>
                <button onclick="sendCompToWhatsapp()" class="w-full bg-emerald-600 text-white font-bold py-2.5 rounded-xl shadow flex items-center justify-center gap-2">
                    <i class="fa-brands fa-whatsapp text-lg"></i> Send to WhatsApp
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="js/firebase-init.js"></script>
    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/topup.js"></script>
    <script src="js/ai-support.js"></script>
</body>
</html>
