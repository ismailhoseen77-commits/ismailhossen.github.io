<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mihadx BD - Free Fire & eFootball Top-Up Store</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="site-header">
        <div class="container nav-container">
            <a href="index.html" class="logo"><i class="fa-solid fa-gamepad"></i> Mihadx BD</a>
            <div id="auth-section">
                <a href="login.html" class="btn-login"><i class="fa-brands fa-google"></i> Login</a>
            </div>
        </div>
    </header>

    <main class="main-content" style="padding-bottom: 70px;">
        <div class="container" id="notice-box-container">
            <div class="notice-bar">
                <i class="fa-solid fa-bullhorn"></i> <span id="notice-text">বিকাশ পেমেন্ট করুন: 01309735129 (Send Money) করে TrxID দিন।</span>
            </div>
        </div>

        <section id="topup" class="container section">
            <h2><i class="fa-solid fa-bolt"></i> Game Top-Up (bKash/Nagad)</h2>
            <div class="game-selector">
                <button class="game-btn active" data-game="freefire">Free Fire</button>
                <button class="game-btn" data-game="efootball">eFootball</button>
            </div>
            <div class="packages-grid" id="packages-grid">
                </div>
        </section>

        <section id="shop" class="container section">
            <h2><i class="fa-solid fa-bag-shopping"></i> E-Commerce Shop</h2>
            <div class="products-grid" id="products-grid">
                </div>
        </section>
    </main>

    <nav class="bottom-nav">
        <a href="index.html" class="bottom-nav-item active"><i class="fa-solid fa-house"></i><span>Home</span></a>
        <a href="track.html" class="bottom-nav-item"><i class="fa-solid fa-receipt"></i><span>My Orders</span></a>
        <a href="admin.html" class="bottom-nav-item center-add"><i class="fa-solid fa-plus"></i></a>
        <a href="track.html" class="bottom-nav-item"><i class="fa-solid fa-code"></i><span>My Codes</span></a>
        <a href="login.html" class="bottom-nav-item"><i class="fa-solid fa-user"></i><span>Account</span></a>
    </nav>

    <div id="ai-chat-widget">
        <button id="ai-toggle-btn"><i class="fa-solid fa-robot"></i></button>
        <div id="ai-chat-box" class="hidden">
            <div class="ai-header"><h3>Mihadx AI Support</h3><button id="ai-close">&times;</button></div>
            <div id="ai-messages">
                <div class="ai-msg"><b>AI:</b> আসসালামু আলাইকুম! টপ-আপ বা অর্ডার সম্পর্কিত যেকোনো প্রয়োজনে আমাকে জিজ্ঞেস করুন। বিকাশ: 01309735129</div>
            </div>
            <div class="ai-input-area">
                <input type="text" id="ai-input" placeholder="আপনার প্রশ্ন লিখুন...">
                <button id="ai-send"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/topup.js"></script>
    <script type="module" src="js/ai-support.js"></script>
</body>
</html>
