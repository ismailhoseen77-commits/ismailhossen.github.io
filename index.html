<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MihadX Topup | Premium Free Fire Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .accent-gradient { background: linear-gradient(135deg, #f59e0b, #ea580c); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <!-- Header -->
    <header class="w-full max-w-3xl flex justify-between items-center py-6">
        <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-orange-500">
            MihadX.pro.bd
        </h1>
        <div class="text-sm text-gray-300 flex gap-4">
            <span><i class="fab fa-whatsapp text-green-500"></i> 01576502490</span>
        </div>
    </header>

    <!-- Main Topup Form -->
    <main class="w-full max-w-3xl glass-panel rounded-2xl p-6 md:p-8 mt-4 shadow-2xl">
        <h2 class="text-2xl font-bold mb-6 border-b border-gray-700 pb-2">Free Fire UID Topup</h2>
        
        <!-- Payment Instruction -->
        <div class="bg-blue-900/30 border border-blue-500/30 rounded-lg p-4 mb-6 text-sm">
            <p class="font-semibold text-blue-400 mb-1"><i class="fas fa-info-circle"></i> How to order:</p>
            <ol class="list-decimal list-inside text-gray-300 space-y-1">
                <li>Send money via Send Money to bKash Personal: <span class="text-pink-500 font-bold tracking-wider">01309735129</span></li>
                <li>Copy the Transaction ID (TrxID) from bKash.</li>
                <li>Fill out the form below and submit.</li>
            </ol>
        </div>

        <form id="topupForm" class="space-y-5">
            <div>
                <label class="block text-sm font-medium mb-1">Player UID</label>
                <input type="text" id="uid" required placeholder="e.g. 1234567890" class="w-full px-4 py-3 bg-gray-800 border border-gray-600 rounded-lg focus:outline-none focus:border-orange-500 transition">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Select Package</label>
                <select id="package" required class="w-full px-4 py-3 bg-gray-800 border border-gray-600 rounded-lg focus:outline-none focus:border-orange-500 transition">
                    <option value="" disabled selected>Select Diamonds...</option>
                    <option value="115 Diamonds | 85 BDT">115 Diamonds - 85 BDT</option>
                    <option value="240 Diamonds | 170 BDT">240 Diamonds - 170 BDT</option>
                    <option value="355 Diamonds | 255 BDT">355 Diamonds - 255 BDT</option>
                    <option value="Weekly Pass | 160 BDT">Weekly Pass - 160 BDT</option>
                    <option value="Monthly Pass | 800 BDT">Monthly Pass - 800 BDT</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">bKash Transaction ID (TrxID)</label>
                <input type="text" id="trxid" required placeholder="e.g. 8K2A8B9CDE" class="w-full px-4 py-3 bg-gray-800 border border-gray-600 rounded-lg focus:outline-none focus:border-orange-500 transition">
            </div>

            <button type="submit" class="w-full accent-gradient text-white font-bold text-lg py-3 rounded-lg hover:opacity-90 transition shadow-lg mt-4">
                Confirm Order
            </button>
        </form>
    </main>

    <!-- Footer -->
    <footer class="mt-auto py-8 text-center text-gray-500 text-sm w-full">
        <p>Email: ismailhoseen77@gmail.com</p>
        <p class="mt-2">© 2026 MihadX.pro.bd. All rights reserved.</p>
    </footer>

    <!-- Firebase SDK Setup -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyACc83rBZjnoZ8l-pZFIRqSs-fyVoiN6ck",
            authDomain: "mihadx-pro-bd.firebaseapp.com",
            projectId: "mihadx-pro-bd",
            storageBucket: "mihadx-pro-bd.firebasestorage.app",
            messagingSenderId: "478391400367",
            appId: "1:478391400367:web:86012d35014ee7350a215a",
            measurementId: "G-E8Y80PDVDD"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('topupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerText = "Processing...";
            btn.disabled = true;

            const uid = document.getElementById('uid').value;
            const pkg = document.getElementById('package').value;
            const trxid = document.getElementById('trxid').value;

            try {
                await addDoc(collection(db, "orders"), {
                    uid: uid,
                    package: pkg,
                    trxid: trxid,
                    status: "Pending",
                    createdAt: serverTimestamp()
                });
                alert("Order placed successfully! We will send your diamonds shortly.");
                e.target.reset();
            } catch (error) {
                console.error("Error adding document: ", error);
                alert("Error placing order. Please contact WhatsApp support.");
            } finally {
                btn.innerText = "Confirm Order";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
