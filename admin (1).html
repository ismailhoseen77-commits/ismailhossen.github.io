<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MihadX Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-slate-950 text-slate-100 p-4 max-w-4xl mx-auto space-y-6">

    <div id="adminAuthScreen" class="flex flex-col items-center justify-center min-h-[80vh] text-center space-y-4">
        <div class="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center text-3xl font-bold text-white shadow-xl mb-2">M</div>
        <h1 class="text-2xl font-bold text-white">Admin Panel Access Restricted</h1>
        <p class="text-slate-400 text-sm max-w-sm">শুধুমাত্র অনুমোদিত জিমেইল অ্যাকাউন্ট দিয়ে লগইন করা যাবে।</p>
        <button onclick="adminLogin()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-6 py-3 rounded-xl flex items-center gap-3 transition">
            <i class="fa-brands fa-google text-lg"></i> Sign in with Google (Admin)
        </button>
    </div>

    <div id="adminDashboard" class="hidden space-y-6">
        <div class="border-b border-slate-800 pb-4 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-indigo-400"><i class="fa-solid fa-user-shield mr-2"></i>Admin Dashboard</h1>
                <p id="adminEmailTag" class="text-xs text-slate-400 font-mono mt-1"></p>
            </div>
            <button onclick="adminLogout()" class="bg-red-600/80 hover:bg-red-600 text-white text-xs px-3 py-2 rounded-lg font-bold">Logout</button>
        </div>

        <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-3">
            <h2 class="font-bold text-lg text-yellow-400">Post Website Notice</h2>
            <div class="flex gap-2">
                <input id="noticeText" class="w-full bg-slate-950 border border-slate-800 p-2.5 rounded text-sm text-white" placeholder="Enter notice text">
                <button onclick="addNotice()" class="bg-yellow-600 hover:bg-yellow-500 text-black px-4 py-2 font-bold rounded text-sm whitespace-nowrap">Post Notice</button>
            </div>
        </div>

        <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-3">
            <h2 class="font-bold text-lg text-indigo-400">Add Recharge Package (FF / E-Football)</h2>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                <select id="pkgCategory" class="bg-slate-950 border border-slate-800 p-2.5 rounded text-sm text-white">
                    <option value="ff">Free Fire Topup</option>
                    <option value="efootball">E-Football Coin</option>
                </select>
                <input id="pkgName" class="bg-slate-950 border border-slate-800 p-2.5 rounded text-sm text-white" placeholder="Package Name (e.g. 115 Diamond)">
                <input id="pkgPrice" type="number" class="bg-slate-950 border border-slate-800 p-2.5 rounded text-sm text-white" placeholder="Price (BDT)">
            </div>
            <button onclick="addPackage()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-4 py-2.5 rounded text-sm w-full">Save Package</button>
        </div>

        <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-3">
            <h2 class="font-bold text-lg text-emerald-400">Add E-Commerce Product</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                <input id="prodTitle" class="bg-slate-950 border border-slate-800 p-2.5 rounded text-sm text-white" placeholder="Product Title">
                <input id="prodPrice" type="number" class="bg-slate-950 border border-slate-800 p-2.5 rounded text-sm text-white" placeholder="Price (BDT)">
                <input id="prodImage" class="bg-slate-950 border border-slate-800 p-2.5 rounded text-sm text-white" placeholder="Product Image Direct URL">
                <input id="prodDetails" class="bg-slate-950 border border-slate-800 p-2.5 rounded text-sm text-white" placeholder="Product Description">
            </div>
            <button onclick="addProduct()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2.5 rounded text-sm w-full">Publish Product</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 🔴 আপনার অনুমোদিত এডমিন জিমেইল ইমেইল এখানে লিখুন
        const ADMIN_EMAIL = "ismailhoseen77@gmail.com";

        const firebaseConfig = {
            apiKey: "AIzaSyACc83rBZjnoZ8l-pZFIRqSs-fyVoiN6ck",
            authDomain: "mihadx-pro-bd.firebaseapp.com",
            projectId: "mihadx-pro-bd",
            storageBucket: "mihadx-pro-bd.firebasestorage.app",
            messagingSenderId: "478391400367",
            appId: "1:478391400367:web:86012d35014ee7350a215a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        window.adminLogin = () => {
            signInWithPopup(auth, provider);
        };

        window.adminLogout = () => {
            signOut(auth);
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                if(user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
                    document.getElementById('adminAuthScreen').classList.add('hidden');
                    document.getElementById('adminDashboard').classList.remove('hidden');
                    document.getElementById('adminEmailTag').innerText = `Logged in as: ${user.email}`;
                } else {
                    signOut(auth);
                    Swal.fire('Access Denied', 'আপনি এই এডমিন প্যানেল ব্যবহারের জন্য অনুমোদিত নন!', 'error');
                }
            } else {
                document.getElementById('adminAuthScreen').classList.remove('hidden');
                document.getElementById('adminDashboard').classList.add('hidden');
            }
        });

        window.addNotice = async () => {
            const text = document.getElementById('noticeText').value;
            if(!text) return alert('Enter notice text!');
            await addDoc(collection(db, "notices"), { text, createdAt: serverTimestamp() });
            Swal.fire('Success', 'Notice Posted Successfully!', 'success');
            document.getElementById('noticeText').value = '';
        };

        window.addPackage = async () => {
            const category = document.getElementById('pkgCategory').value;
            const name = document.getElementById('pkgName').value;
            const price = document.getElementById('pkgPrice').value;
            if(!name || !price) return alert('Fill all fields!');
            await addDoc(collection(db, "packages"), { category, name, price: Number(price), createdAt: serverTimestamp() });
            Swal.fire('Success', 'Package Added!', 'success');
            document.getElementById('pkgName').value = '';
            document.getElementById('pkgPrice').value = '';
        };

        window.addProduct = async () => {
            const title = document.getElementById('prodTitle').value;
            const price = document.getElementById('prodPrice').value;
            const image = document.getElementById('prodImage').value;
            const details = document.getElementById('prodDetails').value;
            if(!title || !price) return alert('Fill product title and price!');
            await addDoc(collection(db, "products"), { title, price: Number(price), image, details, createdAt: serverTimestamp() });
            Swal.fire('Success', 'Product Published!', 'success');
            document.getElementById('prodTitle').value = '';
            document.getElementById('prodPrice').value = '';
                document.getElementById('prodImage').value = '';
            document.getElementById('prodDetails').value = '';
        };
    </script>
</body>
</html>
