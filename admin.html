<!DOCTYPE html>
<html lang="bn" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - MIHADX PRO BD</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Hind Siliguri', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen p-4">

  <!-- Auth / Login Screen -->
  <div id="auth-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900 text-white p-4">
    <div class="text-center max-w-sm w-full bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700">
      <h1 class="text-2xl font-bold mb-2">এডমিন প্যানেল</h1>
      <p class="mb-6 text-sm text-slate-300">প্রবেশ করতে আপনার এডমিন জিমেইল দিয়ে লগইন করুন</p>
      <button id="btn-login" class="w-full bg-white text-slate-900 py-3 px-4 rounded-xl font-bold shadow-lg hover:bg-slate-100 transition-all flex items-center justify-center gap-2">
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.14C3.15 21.32 7.22 24 12 24z"/>
          <path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.62H1.18C.43 8.13 0 9.83 0 12s.43 3.87 1.18 5.38l4.09-3.14z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.22 0 3.15 2.68 1.18 6.62l4.09 3.14c.95-2.85 3.6-4.96 6.73-4.96z"/>
        </svg>
        Admin Google Login
      </button>
    </div>
  </div>

  <!-- Unauthorized Screen -->
  <div id="unauthorized-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-red-950 text-white p-4 hidden">
    <div class="text-center max-w-sm w-full bg-red-900 p-6 rounded-2xl shadow-xl border border-red-700">
      <h1 class="text-2xl font-bold mb-2 text-red-200">অ্যাক্সেস অস্বীকৃত!</h1>
      <p class="mb-4 text-sm text-red-200">আপনার এই এডমিন পেজে প্রবেশ করার কোনো অনুমতি নেই।</p>
      <button onclick="logout()" class="w-full bg-white text-red-900 py-2 rounded-xl font-bold">লগআউট করুন</button>
    </div>
  </div>

  <!-- Admin Dashboard Content -->
  <div id="admin-content" class="hidden max-w-5xl mx-auto space-y-6">
    <header class="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow flex justify-between items-center">
      <h1 class="text-xl font-bold text-orange-600">এডমিন ড্যাশবোর্ড - MIHADX PRO BD</h1>
      <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded-xl font-bold text-sm">লগআউট</button>
    </header>

    <section class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold">সকল ইউজারের অর্ডারসমূহ</h2>
        <button onclick="loadAllOrders()" class="bg-orange-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold">রিফ্রেশ করুন</button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b bg-slate-50 dark:bg-slate-700 text-xs text-slate-600 dark:text-slate-300">
              <th class="p-3">তারিখ ও সময়</th>
              <th class="p-3">ইউজার জিমেইল</th>
              <th class="p-3">প্যাকেজ ও মূল্য</th>
              <th class="p-3">গেম UID</th>
              <th class="p-3">TrxID</th>
              <th class="p-3">স্ট্যাটাস</th>
              <th class="p-3">অ্যাকশন</th>
            </tr>
          </thead>
          <tbody id="admin-orders-list" class="text-sm">
            <tr><td colspan="7" class="text-center p-4 text-slate-400">লোড হচ্ছে...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <!-- Firebase Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyACc83rBZjnoZ8l-pZFIRqSs-fyVoiN6ck",
      authDomain: "mihadx-pro-bd.firebaseapp.com",
      projectId: "mihadx-pro-bd",
      storageBucket: "mihadx-pro-bd.firebasestorage.app",
      messagingSenderId: "478391400367",
      appId: "1:478391400367:web:86012d35014ee7350a215a",
      measurementId: "G-E8Y80PDVDD"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // তোমার আসল এডমিন জিমেইল এখানে সেট করা হলো
    const ADMIN_EMAIL = "ismailhoseen77@gmail.com"; 

    document.getElementById('btn-login').addEventListener('click', async () => {
      try {
        await signInWithPopup(auth, new GoogleAuthProvider());
      } catch (error) {
        alert("লগইন ত্রুটি: " + error.message);
      }
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('auth-screen').classList.add('hidden');
        
        if (user.email === ADMIN_EMAIL) {
          document.getElementById('unauthorized-screen').classList.add('hidden');
          document.getElementById('admin-content').classList.remove('hidden');
          loadAllOrders();
        } else {
          document.getElementById('admin-content').classList.add('hidden');
          document.getElementById('unauthorized-screen').classList.remove('hidden');
        }
      } else {
        document.getElementById('auth-screen').classList.remove('hidden');
        document.getElementById('unauthorized-screen').classList.add('hidden');
        document.getElementById('admin-content').classList.add('hidden');
      }
    });

    window.logout = () => signOut(auth);

    window.loadAllOrders = async () => {
      const tbody = document.getElementById('admin-orders-list');
      tbody.innerHTML = `<tr><td colspan="7" class="text-center p-4 text-slate-400">লোড হচ্ছে...</td></tr>`;

      try {
        const querySnapshot = await getDocs(collection(db, "orders"));
        let html = '';
        querySnapshot.forEach((documentSnap) => {
          const data = documentSnap.data();
          const docId = documentSnap.id;
          const isCompleted = data.status === 'Completed';

          html += `
            <tr class="border-b dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/50">
              <td class="p-3 text-xs text-slate-500">${data.date || 'N/A'}</td>
              <td class="p-3 text-xs font-semibold">${data.userEmail}</td>
              <td class="p-3 font-bold">${data.itemName} <br><span class="text-orange-600 text-xs">${data.price} TK</span></td>
              <td class="p-3 font-mono font-bold text-slate-700 dark:text-slate-300">${data.gameUid}</td>
              <td class="p-3 font-mono font-bold text-pink-600">${data.trxId}</td>
              <td class="p-3">
                <span class="px-2.5 py-1 rounded-full text-xs font-bold ${isCompleted ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}">
                  ${data.status || 'Pending'}
                </span>
              </td>
              <td class="p-3">
                <button onclick="updateStatus('${docId}', '${isCompleted ? 'Pending' : 'Completed'}')" class="px-3 py-1.5 bg-slate-900 text-white rounded-lg text-xs font-bold hover:bg-orange-600 transition-all">
                  ${isCompleted ? 'Pending করুন' : 'Complete করুন'}
                </button>
              </td>
            </tr>
          `;
        });

        tbody.innerHTML = html || `<tr><td colspan="7" class="text-center p-4 text-slate-400">কোনো অর্ডার পাওয়া যায়নি।</td></tr>`;
      } catch (error) {
        console.error(error);
        tbody.innerHTML = `<tr><td colspan="7" class="text-center p-4 text-red-500">অর্ডার লোড করতে সমস্যা হয়েছে।</td></tr>`;
      }
    };

    window.updateStatus = async (docId, newStatus) => {
      try {
        await updateDoc(doc(db, "orders", docId), { status: newStatus });
        alert('অর্ডারের স্ট্যাটাস সফলভাবে আপডেট করা হয়েছে!');
        loadAllOrders();
      } catch (e) {
        console.error(e);
        alert('স্ট্যাটাস আপডেট করা যায়নি।');
      }
    };
  </script>
</body>
</html>
