<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - MIHADX PRO BD</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style> body { font-family: 'Hind Siliguri', sans-serif; } </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 pb-20">

  <div class="max-w-md mx-auto space-y-6">

    <!-- Header with Profile / Logged-in Email Display -->
    <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 flex justify-between items-center shadow-lg">
      <div>
        <h1 class="font-bold text-lg text-orange-500">এডমিন ড্যাশবোর্ড</h1>
        <p id="admin-email-display" class="text-[10px] text-orange-400 font-mono mt-0.5">যাচাই করা হচ্ছে...</p>
      </div>
      <button onclick="logout()" class="bg-red-600 hover:bg-red-700 text-white text-xs px-3 py-2 rounded-xl font-bold transition-all">
        লগআউট
      </button>
    </div>

    <!-- Orders Management Section -->
    <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 space-y-4 shadow-lg">
      <div class="flex justify-between items-center">
        <h2 class="font-bold text-sm text-amber-400 flex items-center gap-2">
          <i class="fa-solid fa-list-check"></i> সকল ইউজারের অর্ডারসমূহ
        </h2>
        <button onclick="loadOrders()" class="bg-orange-600 text-xs px-3 py-1.5 rounded-lg font-bold hover:bg-orange-700 transition-all">
          রিফ্রেশ করুন
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-xs">
          <thead>
            <tr class="border-b border-slate-700 text-slate-400 bg-slate-900/50">
              <th class="p-2">TrxID / বিবরন</th>
              <th class="p-2">স্ট্যাটাস</th>
              <th class="p-2 text-center">অ্যাকশন</th>
            </tr>
          </thead>
          <tbody id="admin-orders-list">
            <tr><td colspan="3" class="text-center p-4 text-slate-400">অর্ডার লোড হচ্ছে...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Add Free Fire Package -->
    <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 space-y-3 shadow-lg">
      <h2 class="font-bold text-sm text-amber-500 flex items-center gap-2">
        <i class="fa-solid fa-fire"></i> ফ্রি ফায়ার প্যাকেজ যুক্ত করুন
      </h2>
      <form id="form-add-ff" class="space-y-3">
        <input type="text" id="ff-name" placeholder="প্যাকেজের নাম (যেমন: 100 Diamond)" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-amber-500" required>
        <input type="number" id="ff-price" placeholder="মূল্য (TK)" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-amber-500" required>
        <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white py-2.5 rounded-xl font-bold text-xs transition-all shadow">
          + ফ্রি ফায়ার প্যাকেজ এড করুন
        </button>
      </form>
    </div>

    <!-- Add eFootball Package -->
    <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 space-y-3 shadow-lg">
      <h2 class="font-bold text-sm text-blue-400 flex items-center gap-2">
        <i class="fa-solid fa-futbol"></i> ই-ফুটবল প্যাকেজ যুক্ত করুন
      </h2>
      <form id="form-add-ef" class="space-y-3">
        <input type="text" id="ef-name" placeholder="প্যাকেজের নাম (যেমন: 130 Coins)" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-blue-500" required>
        <input type="number" id="ef-price" placeholder="মূল্য (TK)" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-blue-500" required>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-xl font-bold text-xs transition-all shadow">
          + ই-ফুটবল প্যাকেজ এড করুন
        </button>
      </form>
    </div>

    <!-- Add E-Commerce Product with Image Upload -->
    <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 space-y-3 shadow-lg">
      <h2 class="font-bold text-sm text-emerald-400 flex items-center gap-2">
        <i class="fa-solid fa-bag-shopping"></i> ই-কমার্স প্রোডাক্ট যুক্ত করুন
      </h2>
      <form id="form-add-product" class="space-y-3">
        <input type="text" id="prod-title" placeholder="প্রোডাক্টের নাম (যেমন: ক্যাজুয়াল শার্ট)" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-emerald-500" required>
        <input type="number" id="prod-price" placeholder="মূল্য (TK)" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-emerald-500" required>
        <select id="prod-category" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-emerald-500">
          <option value="Shirt">শার্ট (Shirt)</option>
          <option value="Pant">প্যান্ট (Pant)</option>
          <option value="Other">অন্যান্য</option>
        </select>
        
        <div>
          <label class="block text-[11px] text-slate-400 mb-1 font-medium">প্রোডাক্টের ছবি আপলোড করুন:</label>
          <input type="file" id="prod-image-file" accept="image/*" class="w-full p-2 bg-slate-900 border border-slate-700 rounded-xl text-xs text-slate-300 file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-emerald-600 file:text-white hover:file:bg-emerald-700 cursor-pointer" required>
        </div>

        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-xl font-bold text-xs transition-all shadow">
          + প্রোডাক্ট এড করুন
        </button>
      </form>
    </div>

  </div>

  <!-- Firebase Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, updateDoc, doc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyACc83rBZjnoZ8l-pZFIRqSs-fyVoiN6ck",
      authDomain: "mihadx-pro-bd.firebaseapp.com",
      projectId: "mihadx-pro-bd",
      storageBucket: "mihadx-pro-bd.firebasestorage.app",
      messagingSenderId: "478391400367",
      appId: "1:478391400367:web:86012d35014ee7350a215a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const ADMIN_EMAIL = "ismailhoseen77@gmail.com"; 

    // Strict Admin Guard & Email Display
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "login.html";
      } else if (user.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
        alert("সতর্কবার্তা: এই এডমিন প্যানেলে প্রবেশ করার অনুমতি আপনার নেই!");
        signOut(auth).then(() => {
          window.location.href = "login.html";
        });
      } else {
        document.getElementById('admin-email-display').innerText = "Logged in: " + user.email;
        loadOrders();
      }
    });

    window.logout = () => signOut(auth).then(() => window.location.href = "login.html");

    // Load Orders with Complete & Cancel Actions
    window.loadOrders = () => {
      onSnapshot(query(collection(db, "orders"), orderBy("createdAt", "desc")), (snapshot) => {
        let html = '';
        snapshot.forEach(docSnap => {
          const data = docSnap.data();
          const orderId = docSnap.id;

          let statusBadge = `<span class="px-2 py-0.5 rounded text-[10px] bg-yellow-500/20 text-yellow-400 border border-yellow-500/30">Pending</span>`;
          if (data.status === 'Completed') {
            statusBadge = `<span class="px-2 py-0.5 rounded text-[10px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">Completed</span>`;
          } else if (data.status === 'Cancelled') {
            statusBadge = `<span class="px-2 py-0.5 rounded text-[10px] bg-red-500/20 text-red-400 border border-red-500/30">Cancelled</span>`;
          }

          let infoText = '';
          if (data.gameType === 'FreeFire') {
            infoText = `UID: ${data.gameUid || 'N/A'}`;
          } else if (data.gameType === 'eFootball') {
            infoText = `${data.accountType || ''} | ID: ${data.accountId || ''} | Pass: ${data.password || ''} | WA: ${data.whatsapp || ''}`;
          } else {
            infoText = `ইউজার: ${data.userEmail || ''}`;
          }

          html += `
            <tr class="border-b border-slate-700 hover:bg-slate-700/30">
              <td class="p-2">
                <div class="font-bold text-orange-400 text-xs">${data.trxId || 'No TrxID'}</div>
                <div class="text-[10px] text-slate-300 font-medium">${data.itemName} (${data.price} TK)</div>
                <div class="text-[9px] text-slate-400 truncate max-w-[140px]" title="${infoText}">${infoText}</div>
              </td>
              <td class="p-2">${statusBadge}</td>
              <td class="p-2 text-center space-y-1">
                ${data.status !== 'Completed' ? `<button onclick="updateOrderStatus('${orderId}', 'Completed')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-[10px] font-bold px-2 py-1 rounded transition-all">Complete</button>` : ''}
                ${data.status !== 'Cancelled' ? `<button onclick="updateOrderStatus('${orderId}', 'Cancelled')" class="w-full bg-red-600 hover:bg-red-700 text-white text-[10px] font-bold px-2 py-1 rounded transition-all">Cancel</button>` : ''}
              </td>
            </tr>`;
        });
        document.getElementById('admin-orders-list').innerHTML = html || `<tr><td colspan="3" class="text-center p-4 text-slate-400">কোনো অর্ডার পাওয়া যায়নি।</td></tr>`;
      });
    };

    // Update Order Status (Complete/Cancel)
    window.updateOrderStatus = async (orderId, status) => {
      const confirmMsg = status === 'Cancelled' ? 'আপনি কি সত্যিই এই অর্ডারটি বাতিল করতে চান?' : 'অর্ডারটি কমপ্লিট হিসেবে মার্ক করতে চান?';
      if (!confirm(confirmMsg)) return;

      try {
        await updateDoc(doc(db, "orders", orderId), { status: status });
        alert(`অর্ডার স্ট্যাটাস '${status}' আপডেট হয়েছে!`);
      } catch (err) {
        alert("স্ট্যাটাস আপডেট করতে ত্রুটি: " + err.message);
      }
    };

    // Add FF Package
    document.getElementById('form-add-ff').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await addDoc(collection(db, "ff_packages"), {
          name: document.getElementById('ff-name').value,
          price: Number(document.getElementById('ff-price').value),
          createdAt: serverTimestamp()
        });
        alert("ফ্রি ফায়ার প্যাকেজ এড হয়েছে!");
        e.target.reset();
      } catch(err) { alert(err.message); }
    });

    // Add eFootball Package
    document.getElementById('form-add-ef').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await addDoc(collection(db, "ef_packages"), {
          name: document.getElementById('ef-name').value,
          price: Number(document.getElementById('ef-price').value),
          createdAt: serverTimestamp()
        });
        alert("ই-ফুটবল প্যাকেজ এড হয়েছে!");
        e.target.reset();
      } catch(err) { alert(err.message); }
    });

    // Add Product with Image File Upload Handler
    document.getElementById('form-add-product').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('prod-title').value;
      const price = Number(document.getElementById('prod-price').value);
      const category = document.getElementById('prod-category').value;
      const fileInput = document.getElementById('prod-image-file');

      if (fileInput.files.length === 0) {
        alert("অনুগ্রহ করে প্রোডাক্টের একটি ছবি সিলেক্ট করুন!");
        return;
      }

      const file = fileInput.files[0];
      const reader = new FileReader();

      reader.onload = async function(uploadEvent) {
        const base64Image = uploadEvent.target.result;
        try {
          await addDoc(collection(db, "products"), {
            title: title,
            price: price,
            category: category,
            imageUrl: base64Image,
            createdAt: serverTimestamp()
          });
          alert("প্রোডাক্ট ছবিসহ সফলভাবে এড হয়েছে!");
          e.target.reset();
        } catch(err) { 
          alert("প্রোডাক্ট এড করতে সমস্যা হয়েছে: " + err.message); 
        }
      };

      reader.readAsDataURL(file);
    });
  </script>
</body>
</html>
