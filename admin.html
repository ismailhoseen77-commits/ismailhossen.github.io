<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | MihadX.pro.bd</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen p-6 flex flex-col items-center">

    <!-- Login Section -->
    <div id="login-section" class="flex flex-col items-center justify-center h-screen w-full">
        <h1 class="text-3xl font-bold mb-6">Admin Access Only</h1>
        <button id="loginBtn" class="bg-white text-gray-900 font-bold py-3 px-6 rounded-lg shadow hover:bg-gray-200 transition">
            Login with Google
        </button>
    </div>

    <!-- Admin Dashboard Section -->
    <div id="admin-section" class="w-full max-w-5xl hidden flex-col">
        <div class="flex justify-between items-center mb-8 border-b border-gray-700 pb-4">
            <h1 class="text-2xl font-bold text-orange-400">Order Management</h1>
            <div class="flex items-center gap-4">
                <span class="text-sm text-gray-400" id="adminEmail"></span>
                <button id="logoutBtn" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded text-sm transition">Logout</button>
            </div>
        </div>

        <div class="bg-gray-800 rounded-lg overflow-hidden shadow-xl">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-900 text-gray-300 text-sm uppercase">
                        <th class="p-4 border-b border-gray-700">Time</th>
                        <th class="p-4 border-b border-gray-700">Player UID</th>
                        <th class="p-4 border-b border-gray-700">Package</th>
                        <th class="p-4 border-b border-gray-700">TrxID</th>
                        <th class="p-4 border-b border-gray-700">Status</th>
                    </tr>
                </thead>
                <tbody id="orderTableBody" class="text-sm">
                    <!-- Orders will be injected here via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyACc83rBZjnoZ8l-pZFIRqSs-fyVoiN6ck",
            authDomain: "mihadx-pro-bd.firebaseapp.com",
            projectId: "mihadx-pro-bd",
            storageBucket: "mihadx-pro-bd.firebasestorage.app",
            messagingSenderId: "478391400367",
            appId: "1:478391400367:web:86012d35014ee7350a215a",
            measurementId: "G-E8Y80PDVDD"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        const loginSection = document.getElementById('login-section');
        const adminSection = document.getElementById('admin-section');
        const orderTableBody = document.getElementById('orderTableBody');

        // Check authentication state
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // VERY IMPORTANT: Check if it's your exact email
                if (user.email === "ismailhoseen77@gmail.com") {
                    loginSection.classList.add('hidden');
                    adminSection.classList.remove('hidden');
                    document.getElementById('adminEmail').innerText = user.email;
                    loadOrders();
                } else {
                    alert("Access Denied. You are not authorized as an admin.");
                    signOut(auth);
                }
            } else {
                loginSection.classList.remove('hidden');
                adminSection.classList.add('hidden');
                loginSection.style.display = 'flex';
            }
        });

        // Login Logic
        document.getElementById('loginBtn').addEventListener('click', () => {
            signInWithPopup(auth, provider).catch((error) => console.error(error));
        });

        // Logout Logic
        document.getElementById('logoutBtn').addEventListener('click', () => {
            signOut(auth);
        });

        // Load Real-time Orders
        function loadOrders() {
            const q = query(collection(db, "orders"), orderBy("createdAt", "desc"));
            
            onSnapshot(q, (snapshot) => {
                orderTableBody.innerHTML = '';
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const time = data.createdAt ? data.createdAt.toDate().toLocaleString() : 'Just now';
                    
                    const row = `
                        <tr class="hover:bg-gray-700 transition border-b border-gray-700/50">
                            <td class="p-4 text-gray-400">${time}</td>
                            <td class="p-4 font-bold text-white">${data.uid}</td>
                            <td class="p-4 text-orange-400">${data.package}</td>
                            <td class="p-4 font-mono text-gray-300">${data.trxid}</td>
                            <td class="p-4">
                                <span class="bg-yellow-500/20 text-yellow-400 px-2 py-1 rounded text-xs font-bold border border-yellow-500/30">
                                    ${data.status}
                                </span>
                            </td>
                        </tr>
                    `;
                    orderTableBody.innerHTML += row;
                });
            });
        }
    </script>
</body>
</html>
