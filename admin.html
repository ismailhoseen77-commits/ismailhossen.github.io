<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - MIHADX PRO BD</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Hind Siliguri', sans-serif; background-color: #0d0714; color: #f3e8ff; }
    .purple-card { background: linear-gradient(145deg, #1e102d, #140b20); border: 1px solid #3b1e54; }
    .purple-btn { background: linear-gradient(90deg, #8b5cf6, #7c3aed); }
  </style>
</head>
<body class="min-h-screen p-4 pb-20">

  <div class="max-w-md mx-auto space-y-5">

    <!-- Header -->
    <div class="purple-card p-4 rounded-2xl flex justify-between items-center shadow-lg">
      <div>
        <h1 class="font-bold text-base text-purple-300">এডমিন ড্যাশবোর্ড</h1>
        <p id="admin-email-display" class="text-[10px] text-purple-400 font-mono">যাচাই করা হচ্ছে...</p>
      </div>
      <button onclick="logout()" class="bg-red-600 hover:bg-red-700 text-white text-xs px-3 py-1.5 rounded-xl font-bold">লগআউট</button>
    </div>

    <!-- Live Notice Setter -->
    <div class="purple-card p-4 rounded-2xl space-y-2">
      <h2 class="font-bold text-xs text-purple-300"><i class="fa-solid fa-bullhorn"></i> সাইট নোটিশ পরিবর্তন করুন</h2>
      <div class="flex gap-2">
        <input type="text" id="notice-input" placeholder="নতুন নোটিশ লিখুন" class="flex-1 p-2 bg-purple-950 border border-purple-800 rounded-xl text-xs text-white outline-none">
        <button onclick="updateNotice()" class="purple-btn text-xs px-3 py-2 rounded-xl font-bold">সেভ</button>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="purple-card p-1.5 rounded-2xl flex justify-between text-xs font-bold">
      <button onclick="switchTab('orders')" id="nav-orders" class="flex-1 py-2 rounded-xl bg-purple-700 text-white text-center">অর্ডারস</button>
      <button onclick="switchTab('packages')" id="nav-packages" class="flex-1 py-2 rounded-xl text-purple-300 text-center">প্যাকেজসমূহ</button>
      <button onclick="switchTab('add')" id="nav-add" class="flex-1 py-2 rounded-xl text-purple-300 text-center">নতুন এড</button>
    </div>

    <!-- TAB 1: ORDERS -->
    <div id="tab-orders" class="purple-card p-4 rounded-2xl space-y-3">
      <h2 class="font-bold text-xs text-amber-400"><i class="fa-solid fa-list-check"></i> ইউজার অর্ডারসমূহ</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-xs">
          <thead>
            <tr class="border-b border-purple-800 text-purple-400">
              <th class="p-2">অর্ডার তথ্য</th>
              <th class="p-2">স্ট্যাটাস</th>
              <th class="p-2 text-center">অ্যাকশন</th>
            </tr>
          </thead>
          <tbody id="admin-orders-list">
            <tr><td colspan="3" class="text-center p-4 text-purple-400">লোড হচ্ছে...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- TAB 2: PACKAGES -->
    <div id="tab-packages" class="space-y-4 hidden">
      <div class="purple-card p-4 rounded-2xl space-y-2">
        <h2 class="font-bold text-xs text-amber-400">ফ্রি ফায়ার প্যাকেজসমূহ</h2>
        <div id="admin-ff-list" class="space-y-2"></div>
      </div>
      <div class="purple-card p-4 rounded-2xl space-y-2">
        <h2 class="font-bold text-xs text-blue-400">ই-ফুটবল প্যাকেজসমূহ</h2>
        <div id="admin-ef-list" class="space-y-2"></div>
      </div>
      <div class="purple-card p-4 rounded-2xl space-y-2">
        <h2 class="font-bold text-xs text-emerald-400">ই-কমার্স প্রোডাক্টসমূহ</h2>
        <div id="admin-prod-list" class="space-y-2"></div>
      </div>
    </div>

    <!-- TAB 3: ADD NEW -->
    <div id="tab-add" class="space-y-4 hidden">
      <!-- Add FF -->
      <form id="form-add-ff" class="purple-card p-4 rounded-2xl space-y-2">
        <h2 class="font-bold text-xs text-amber-400">+ ফ্রি ফায়ার প্যাকেজ এড</h2>
        <input type="text" id="ff-name" placeholder="নাম (যেমন: 115 Diamond)" class="w-full p-2 bg-purple-950 border border-purple-800 rounded-xl text-xs text-white" required>
        <input type="number" id="ff-price" placeholder="দাম (TK)" class="w-full p-2 bg-purple-950 border border-purple-800 rounded-xl text-xs text-white" required>
        <button type="submit" class="w-full purple-btn py-2 rounded-xl text-xs font-bold">+ এড করুন</button>
      </form>

      <!-- Add EF -->
      <form id="form-add-ef" class="purple-card p-4 rounded-2xl space-y-2">
        <h2 class="font-bold text-xs text-blue-400">+ ই-ফুটবল প্যাকেজ এড</h2>
        <input type="text" id="ef-name" placeholder="নাম (যেমন: 130 Coins)" class="w-full p-2 bg-purple-950 border border-purple-800 rounded-xl text-xs text-white" required>
        <input type="number" id="ef-price" placeholder="দাম (TK)" class="w-full p-2 bg-purple-950 border border-purple-800 rounded-xl text-xs text-white" required>
        <button type="submit" class="w-full purple-btn py-2 rounded-xl text-xs font-bold">+ এড করুন</button>
      </form>

      <!-- Add Product -->
      <form id="form-add-prod" class="purple-card p-4 rounded-2xl space-y-2">
        <h2 class="font-bold text-xs text-emerald-400">+ ই-কমার্স প্রোডাক্ট এড</h2>
        <input type="text" id="prod-title" placeholder="প্রোডাক্ট নাম" class="w-full p-2 bg-purple-950 border border-purple-800 rounded-xl text-xs text-white" required>
        <input type="number" id="prod-price" placeholder="দাম (TK)" class="w-full p-2 bg-purple-950 border border-purple-800 rounded-xl text-xs text-white" required>
        <textarea id="prod-desc" placeholder="বিবরণ (Description)" class="w-full p-2 bg-purple-950 border border-purple-800 rounded-xl text-xs text-white"></textarea>
        <input type="file" id="prod-img" accept="image/*" class="w-full text-xs text-purple-300" required>
        <button type="submit" class="w-full purple-btn py-2 rounded-xl text-xs font-bold">+ আপলোড ও এড করুন</button>
      </form>
    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, setDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyACc83rBZjnoZ8l-pZFIRqSs-fyVoiN6ck",
      authDomain: "mihadx-pro-bd.firebaseapp.com",
      projectId: "mihadx-pro-bd",
      storageBucket: "mihadx-pro-bd.firebasestorage.app",
      messagingSenderId: "478391400367",
      appId: "1:478391400367:web:86012d35014ee7350a215a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const ADMIN_EMAIL = "ismailhoseen77@gmail.com";

    onAuthStateChanged(auth, (user) => {
      if (!user || user.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
        alert("অনুমতি নেই!");
        window.location.href = "login.html";
      } else {
        document.getElementById('admin-email-display').innerText = user.email;
        loadOrders();
        loadExistingItems();
      }
    });

    window.logout = () => signOut(auth).then(() => window.location.href = "login.html");

    window.updateNotice = async () => {
      const txt = document.getElementById('notice-input').value;
      if(!txt) return alert('নোটিশ লিখুন!');
      await setDoc(doc(db, "settings", "notice"), { text: txt });
      alert('নোটিশ আপডেট হয়েছে!');
    };

    window.switchTab = (tab) => {
      ['orders', 'packages', 'add'].forEach(t => document.getElementById('tab-'+t).classList.add('hidden'));
      document.getElementById('tab-'+tab).classList.remove('hidden');
    };

    function loadOrders() {
      onSnapshot(query(collection(db, "orders"), orderBy("createdAt", "desc")), (snap) => {
        let html = '';
        snap.forEach(docSnap => {
          const data = docSnap.data();
          const id = docSnap.id;
          let info = '';
          if(data.gameType === 'FreeFire') info = `UID: ${data.gameUid}`;
          else if(data.gameType === 'eFootball') info = `${data.accountType} | ID: ${data.accountId} | Pass: ${data.password} | Backup: ${data.backupCode} | WA: ${data.whatsapp}`;
          else if(data.gameType === 'ECommerce') info = `Size: ${data.size} | Address: ${data.address} | Phone: ${data.phone}`;

          html += `<tr class="border-b border-purple-800">
            <td class="p-2">
              <div class="font-bold text-purple-300">${data.itemName} (${data.price} TK)</div>
              <div class="text-[10px] text-pink-400 font-mono">TrxID: ${data.trxId}</div>
              <div class="text-[9px] text-purple-400">${info}</div>
            </td>
            <td class="p-2 text-[10px]">${data.status}</td>
            <td class="p-2 space-y-1">
              <button onclick="updateStatus('${id}', 'Completed')" class="bg-emerald-600 text-[9px] px-2 py-0.5 rounded w-full">Complete</button>
              <button onclick="updateStatus('${id}', 'Cancelled')" class="bg-red-600 text-[9px] px-2 py-0.5 rounded w-full">Cancel</button>
            </td>
          </tr>`;
        });
        document.getElementById('admin-orders-list').innerHTML = html || '<tr><td colspan="3" class="p-4 text-center">কোনো অর্ডার নেই</td></tr>';
      });
    }

    window.updateStatus = async (id, status) => {
      await updateDoc(doc(db, "orders", id), { status: status });
      alert('আপডেট হয়েছে!');
    };

    function loadExistingItems() {
      onSnapshot(collection(db, "ff_packages"), snap => {
        let h = '';
        snap.forEach(d => {
          const i = d.data();
          h += `<div class="flex justify-between p-2 bg-purple-950/60 rounded-xl text-xs"><span>${i.name} - ${i.price} TK</span><button onclick="deleteDoc(doc(db, 'ff_packages', '${d.id}'))" class="text-red-400"><i class="fa-solid fa-trash"></i></button></div>`;
        });
        document.getElementById('admin-ff-list').innerHTML = h;
      });

      onSnapshot(collection(db, "ef_packages"), snap => {
        let h = '';
        snap.forEach(d => {
          const i = d.data();
          h += `<div class="flex justify-between p-2 bg-purple-950/60 rounded-xl text-xs"><span>${i.name} - ${i.price} TK</span><button onclick="deleteDoc(doc(db, 'ef_packages', '${d.id}'))" class="text-red-400"><i class="fa-solid fa-trash"></i></button></div>`;
        });
        document.getElementById('admin-ef-list').innerHTML = h;
      });

      onSnapshot(collection(db, "products"), snap => {
        let h = '';
        snap.forEach(d => {
          const i = d.data();
          h += `<div class="flex justify-between p-2 bg-purple-950/60 rounded-xl text-xs"><span>${i.title} - ${i.price} TK</span><button onclick="deleteDoc(doc(db, 'products', '${d.id}'))" class="text-red-400"><i class="fa-solid fa-trash"></i></button></div>`;
        });
        document.getElementById('admin-prod-list').innerHTML = h;
      });
    }

    document.getElementById('form-add-ff').onsubmit = async (e) => {
      e.preventDefault();
      await addDoc(collection(db, "ff_packages"), { name: document.getElementById('ff-name').value, price: Number(document.getElementById('ff-price').value) });
      e.target.reset(); alert('এড হয়েছে!');
    };

    document.getElementById('form-add-ef').onsubmit = async (e) => {
      e.preventDefault();
      await addDoc(collection(db, "ef_packages"), { name: document.getElementById('ef-name').value, price: Number(document.getElementById('ef-price').value) });
      e.target.reset(); alert('এড হয়েছে!');
    };

    document.getElementById('form-add-prod').onsubmit = async (e) => {
      e.preventDefault();
      const reader = new FileReader();
      reader.onload = async (ev) => {
        await addDoc(collection(db, "products"), {
          title: document.getElementById('prod-title').value,
          price: Number(document.getElementById('prod-price').value),
          description: document.getElementById('prod-desc').value,
          imageUrl: ev.target.result
        });
        e.target.reset(); alert('প্রোডাক্ট এড হয়েছে!');
      };
      reader.readAsDataURL(document.getElementById('prod-img').files[0]);
    };
  </script>
</body>
    </html>
