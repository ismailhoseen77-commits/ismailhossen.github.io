<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Control Panel - MIHADX PRO BD</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Hind Siliguri', sans-serif; background-color: #0d0914; color: #f1f5f9; }
    .glass-card { background: #161022; border: 1px solid #2d2244; }
  </style>
</head>
<body class="min-h-screen p-4 pb-20 max-w-md mx-auto space-y-4">

  <!-- Admin Header -->
  <div class="glass-card rounded-2xl p-4 flex justify-between items-center shadow-lg">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-purple-900/60 text-purple-300 border border-purple-500/30 flex items-center justify-center font-bold text-xl">
        <i class="fa-solid fa-user-shield"></i>
      </div>
      <div>
        <h1 class="font-bold text-sm text-purple-200">এডমিন কন্ট্রোল প্যানেল</h1>
        <p id="admin-email" class="text-[11px] text-purple-400 font-mono">Loading...</p>
      </div>
    </div>
    <button onclick="logoutAdmin()" class="w-9 h-9 rounded-xl bg-red-950/40 border border-red-500/30 text-red-400 flex items-center justify-center hover:bg-red-900/60 transition">
      <i class="fa-solid fa-power-off text-sm"></i>
    </button>
  </div>

  <!-- Navigation Tabs -->
  <div class="grid grid-cols-3 gap-2 bg-[#120c1d] p-1.5 rounded-2xl border border-purple-900/40 text-xs font-bold">
    <button onclick="showAdminTab('orders')" id="tab-orders" class="py-2 rounded-xl text-slate-400 flex items-center justify-center gap-1.5 transition">
      <i class="fa-solid fa-shopping-bag"></i> অর্ডারসমূহ
    </button>
    <button onclick="showAdminTab('items')" id="tab-items" class="py-2 rounded-xl bg-purple-600 text-white flex items-center justify-center gap-1.5 shadow-md">
      <i class="fa-solid fa-boxes-stacked"></i> আইটেম লিস্ট
    </button>
    <button onclick="showAdminTab('add')" id="tab-add" class="py-2 rounded-xl text-slate-400 flex items-center justify-center gap-1.5 transition">
      <i class="fa-solid fa-circle-plus"></i> নতুন এড
    </button>
  </div>

  <!-- VIEW: ITEMS LIST -->
  <div id="view-items-list" class="space-y-4">
    
    <!-- Free Fire List -->
    <div class="space-y-2">
      <h2 class="text-xs font-bold text-amber-400 flex items-center gap-1.5">
        <i class="fa-solid fa-fire"></i> ফ্রি ফায়ার প্যাকেজ
      </h2>
      <div id="ff-list-container" class="space-y-2">
        <p class="text-xs text-slate-500 py-2 text-center">প্যাকেজ লোড হচ্ছে...</p>
      </div>
    </div>

    <!-- eFootball List -->
    <div class="space-y-2 pt-2">
      <h2 class="text-xs font-bold text-blue-400 flex items-center gap-1.5">
        <i class="fa-solid fa-futbol"></i> ই-ফুটবল প্যাকেজ
      </h2>
      <div id="ef-list-container" class="space-y-2">
        <p class="text-xs text-slate-500 py-2 text-center">প্যাকেজ লোড হচ্ছে...</p>
      </div>
    </div>

  </div>

  <!-- VIEW: ADD NEW ITEM -->
  <div id="view-add-item" class="hidden glass-card p-4 rounded-2xl space-y-3 border border-purple-500/20">
    <h2 class="text-xs font-bold text-purple-300 border-b border-purple-800/50 pb-2">নতুন প্যাকেজ যোগ করুন</h2>
    
    <div>
      <label class="text-[11px] text-slate-400">ক্যাটাগরি সিলেক্ট করুন</label>
      <select id="add-pkg-cat" class="w-full mt-1 p-2.5 bg-[#0d0914] border border-purple-900/60 rounded-xl text-xs text-slate-200 outline-none">
        <option value="ff">Free Fire</option>
        <option value="ef">eFootball</option>
      </select>
    </div>

    <div>
      <label class="text-[11px] text-slate-400">প্যাকেজের নাম</label>
      <input type="text" id="add-pkg-name" placeholder="যেমন: 100 Diamond" class="w-full mt-1 p-2.5 bg-[#0d0914] border border-purple-900/60 rounded-xl text-xs text-slate-200 outline-none focus:border-purple-500">
    </div>

    <div>
      <label class="text-[11px] text-slate-400">দাম (টাকা)</label>
      <input type="number" id="add-pkg-price" placeholder="যেমন: 75" class="w-full mt-1 p-2.5 bg-[#0d0914] border border-purple-900/60 rounded-xl text-xs text-slate-200 outline-none focus:border-purple-500">
    </div>

    <button onclick="addNewPackage()" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-lg shadow-purple-900/40">
      প্যাকেজ সেভ করুন
    </button>
  </div>

  <!-- EDIT MODAL -->
  <div id="edit-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="glass-card w-full max-w-xs p-4 rounded-2xl space-y-3 border border-purple-500/30">
      <div class="flex justify-between items-center border-b border-purple-800/40 pb-2">
        <h3 class="text-xs font-bold text-purple-300">প্যাকেজ এডিট করুন</h3>
        <button onclick="closeEditModal()" class="text-slate-400 hover:text-white text-xs"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <input type="hidden" id="edit-doc-id">
      <input type="hidden" id="edit-type">

      <div>
        <label class="text-[11px] text-slate-400">প্যাকেজের নাম</label>
        <input type="text" id="edit-pkg-name" class="w-full mt-1 p-2.5 bg-[#0d0914] border border-purple-900/60 rounded-xl text-xs text-slate-200 outline-none">
      </div>

      <div>
        <label class="text-[11px] text-slate-400">দাম (টাকা)</label>
        <input type="number" id="edit-pkg-price" class="w-full mt-1 p-2.5 bg-[#0d0914] border border-purple-900/60 rounded-xl text-xs text-slate-200 outline-none">
      </div>

      <button onclick="saveEditPackage()" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-2 rounded-xl text-xs transition shadow-md">
        আপডেট করুন
      </button>
    </div>
          </div>
    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyACc83rBZjnoZ8l-pZFIRqSs-fyVoiN6ck",
      authDomain: "mihadx-pro-bd.firebaseapp.com",
      projectId: "mihadx-pro-bd",
      storageBucket: "mihadx-pro-bd.firebasestorage.app",
      messagingSenderId: "478391400367",
      appId: "1:478391400367:web:86012d35014ee7350a215a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('admin-email').innerText = user.email;
      } else {
        window.location.href = "login.html";
      }
    });

    window.logoutAdmin = () => {
      signOut(auth).then(() => window.location.href = "login.html");
    };

    // Tab switcher
    window.showAdminTab = (tab) => {
      ['orders', 'items', 'add'].forEach(t => {
        const btn = document.getElementById('tab-' + t);
        if(t === tab) {
          btn.className = "py-2 rounded-xl bg-purple-600 text-white flex items-center justify-center gap-1.5 shadow-md";
        } else {
          btn.className = "py-2 rounded-xl text-slate-400 flex items-center justify-center gap-1.5 transition";
        }
      });

      document.getElementById('view-items-list').classList.toggle('hidden', tab !== 'items');
      document.getElementById('view-add-item').classList.toggle('hidden', tab !== 'add');
    };

    // Load Items List with Edit & Order Control Options
    function loadPackages(type, containerId) {
      const colName = type === 'ff' ? 'ff_packages' : 'ef_packages';
      onSnapshot(collection(db, colName), (snap) => {
        let items = [];
        snap.forEach(d => {
          items.push({ id: d.id, ...d.data() });
        });

        // Order Sorting (by order field or default array)
        items.sort((a, b) => (a.order || 0) - (b.order || 0));

        let html = '';
        items.forEach((item, index) => {
          html += `
            <div class="glass-card p-3 rounded-2xl flex items-center justify-between border border-purple-900/30">
              <div class="flex items-center gap-2">
                <!-- Reorder Up/Down Buttons -->
                <div class="flex flex-col gap-0.5 text-[10px]">
                  <button onclick="moveItem('${type}', '${item.id}', ${index}, -1, ${items.length})" class="w-5 h-4 bg-purple-900/60 text-purple-300 rounded flex items-center justify-center hover:bg-purple-700"><i class="fa-solid fa-chevron-up"></i></button>
                  <button onclick="moveItem('${type}', '${item.id}', ${index}, 1, ${items.length})" class="w-5 h-4 bg-purple-900/60 text-purple-300 rounded flex items-center justify-center hover:bg-purple-700"><i class="fa-solid fa-chevron-down"></i></button>
                </div>
                <div>
                  <p class="font-bold text-xs text-slate-200">${item.name}</p>
                  <p class="text-[11px] font-bold text-amber-400">${item.price} TK</p>
                </div>
              </div>

              <div class="flex items-center gap-2">
                <!-- Edit Button -->
                <button onclick="openEditModal('${type}', '${item.id}', '${item.name}', '${item.price}')" class="w-8 h-8 rounded-xl bg-amber-950/40 border border-amber-500/30 text-amber-400 flex items-center justify-center hover:bg-amber-900/60 transition">
                  <i class="fa-solid fa-pen-to-square text-xs"></i>
                </button>
                <!-- Delete Button -->
                <button onclick="deletePackage('${type}', '${item.id}')" class="w-8 h-8 rounded-xl bg-red-950/40 border border-red-500/30 text-red-400 flex items-center justify-center hover:bg-red-900/60 transition">
                  <i class="fa-solid fa-trash-can text-xs"></i>
                </button>
              </div>
            </div>
          `;
        });

        document.getElementById(containerId).innerHTML = html || '<p class="text-xs text-slate-500 text-center py-2">কোনো প্যাকেজ নেই</p>';
      });
    }

    // Move Item Up / Down (Sort adjustment)
    window.moveItem = async (type, id, currentIndex, direction, totalCount) => {
      const newIndex = currentIndex + direction;
      if (newIndex < 0 || newIndex >= totalCount) return;

      const colName = type === 'ff' ? 'ff_packages' : 'ef_packages';
      await updateDoc(doc(db, colName, id), {
        order: newIndex
      });
    };

    // Open Edit Modal
    window.openEditModal = (type, id, name, price) => {
      document.getElementById('edit-type').value = type;
      document.getElementById('edit-doc-id').value = id;
      document.getElementById('edit-pkg-name').value = name;
      document.getElementById('edit-pkg-price').value = price;
      document.getElementById('edit-modal').classList.remove('hidden');
    };

    window.closeEditModal = () => {
      document.getElementById('edit-modal').classList.add('hidden');
    };

    // Save Edit Package
    window.saveEditPackage = async () => {
      const type = document.getElementById('edit-type').value;
      const id = document.getElementById('edit-doc-id').value;
      const name = document.getElementById('edit-pkg-name').value;
      const price = Number(document.getElementById('edit-pkg-price').value);

      if(!name || !price) return alert('অনুগ্রহ করে নাম এবং দাম প্রদান করুন!');

      const colName = type === 'ff' ? 'ff_packages' : 'ef_packages';
      try {
        await updateDoc(doc(db, colName, id), { name, price });
        closeEditModal();
        alert('প্যাকেজ সফলভাবে আপডেট করা হয়েছে!');
      } catch(err) {
        alert('ত্রুটি হয়েছে: ' + err.message);
      }
    };

    // Delete Package
    window.deletePackage = async (type, id) => {
      if(!confirm('আপনি কি নিশ্চিত যে এই প্যাকেজটি ডিলিট করতে চান?')) return;
      const colName = type === 'ff' ? 'ff_packages' : 'ef_packages';
      try {
        await deleteDoc(doc(db, colName, id));
      } catch(err) {
        alert('ত্রুটি হয়েছে: ' + err.message);
      }
    };

    // Add New Package
    window.addNewPackage = async () => {
      const cat = document.getElementById('add-pkg-cat').value;
      const name = document.getElementById('add-pkg-name').value.trim();
      const price = Number(document.getElementById('add-pkg-price').value);

      if(!name || !price) return alert('নাম এবং সঠিক দাম প্রদান করুন!');

      const colName = cat === 'ff' ? 'ff_packages' : 'ef_packages';
      try {
        await addDoc(collection(db, colName), {
          name: name,
          price: price,
          order: Date.now()
        });

        document.getElementById('add-pkg-name').value = '';
        document.getElementById('add-pkg-price').value = '';
        alert('নতুন প্যাকেজ সফলভাবে যুক্ত হয়েছে!');
        showAdminTab('items');
      } catch(err) {
        alert('ত্রুটি হয়েছে: ' + err.message);
      }
    };

    // Initial load
    loadPackages('ff', 'ff-list-container');
    loadPackages('ef', 'ef-list-container');
  </script>
</body>
</html>
