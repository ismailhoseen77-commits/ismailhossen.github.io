<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - MIHADX BD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 p-4 pb-12 font-sans">

    <header class="bg-slate-900 text-white p-4 rounded-xl mb-6 flex justify-between items-center">
        <h1 class="font-black text-lg text-indigo-400">MIHADX ADMIN</h1>
        <span class="text-xs bg-indigo-600 px-2 py-1 rounded font-bold">Control Panel</span>
    </header>

    <main class="max-w-2xl mx-auto space-y-6">

        <section class="bg-white p-4 rounded-xl shadow-sm border space-y-3">
            <h2 class="font-bold text-xs text-gray-700 border-b pb-2"><i class="fa-solid fa-bullhorn text-indigo-600 mr-1"></i> নোটিশ ও ব্যানার সেটআপ</h2>
            <input type="text" id="admin-notice-input" placeholder="নোটিশের লেখা লিখুন..." class="w-full border rounded-lg p-2 text-xs bg-gray-50 outline-none">
            
            <label class="block text-[11px] font-bold text-gray-600">ফোল্ডার থেকে নোটিশ ছবি বাছুন:</label>
            <input type="file" id="admin-notice-file" accept="image/*" class="w-full border rounded-lg p-1.5 text-xs bg-gray-50">
            
            <button onclick="updateNotice()" id="btn-notice" class="w-full bg-indigo-600 text-white font-bold py-2 rounded-lg text-xs">Save Notice</button>
        </section>

        <section class="bg-white p-4 rounded-xl shadow-sm border space-y-3">
            <h2 class="font-bold text-xs text-gray-700 border-b pb-2"><i class="fa-solid fa-plus text-indigo-600 mr-1"></i> নতুন টপআপ প্যাকেজ যুক্ত করুন</h2>
            <select id="pkg-game-type" class="w-full border rounded-lg p-2 text-xs bg-gray-50 outline-none">
                <option value="freefire">Free Fire Diamond</option>
                <option value="efootball">E-Football Coin</option>
            </select>
            <input type="text" id="pkg-name-input" placeholder="প্যাকেজের নাম (যেমন: 115 Diamond)" class="w-full border rounded-lg p-2 text-xs bg-gray-50 outline-none">
            <input type="number" id="pkg-price-input" placeholder="দাম (BDT)" class="w-full border rounded-lg p-2 text-xs bg-gray-50 outline-none">
            <button onclick="addNewPackage()" class="w-full bg-emerald-600 text-white font-bold py-2 rounded-lg text-xs">+ প্যাকেজ যুক্ত করুন</button>
        </section>

        <section class="bg-white p-4 rounded-xl shadow-sm border space-y-3">
            <h2 class="font-bold text-xs text-gray-700 border-b pb-2"><i class="fa-solid fa-cart-plus text-indigo-600 mr-1"></i> নতুন ই-কমার্স প্রোডাক্ট যুক্ত করুন</h2>
            <input type="text" id="prod-title-input" placeholder="প্রোডাক্টের নাম" class="w-full border rounded-lg p-2 text-xs bg-gray-50 outline-none">
            <input type="number" id="prod-price-input" placeholder="দাম (BDT)" class="w-full border rounded-lg p-2 text-xs bg-gray-50 outline-none">
            
            <label class="block text-[11px] font-bold text-gray-600">ফোল্ডার থেকে প্রোডাক্টের ছবি বাছুন:</label>
            <input type="file" id="prod-img-file" accept="image/*" class="w-full border rounded-lg p-1.5 text-xs bg-gray-50">
            
            <button onclick="addEcommerceProduct()" id="btn-prod" class="w-full bg-purple-600 text-white font-bold py-2 rounded-lg text-xs">+ প্রোডাক্ট প্রকাশ করুন</button>
        </section>

        <section class="bg-white p-4 rounded-xl shadow-sm border space-y-3">
            <h2 class="font-bold text-xs text-gray-700 border-b pb-2">যুক্ত থাকা প্যাকেজসমূহ</h2>
            <div id="admin-packages-list" class="space-y-2"></div>
        </section>

        <section class="bg-white p-4 rounded-xl shadow-sm border space-y-3">
            <h2 class="font-bold text-xs text-gray-700 border-b pb-2">অর্ডার লিস্ট</h2>
            <div id="admin-orders-list" class="space-y-2"></div>
        </section>

    </main>

    <script src="js/firebase-init.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
