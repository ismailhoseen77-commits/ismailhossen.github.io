<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zain E-Shop - Secure Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #f4f1f8; color: #333; padding: 15px; }
        .admin-container { max-width: 700px; margin: 0 auto; }
        .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .hidden { display: none !important; }
        .btn { background: #6f2c91; color: #fff; border: none; padding: 11px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 6px; }
        .form-control { width: 100%; padding: 11px; border: 1.5px solid #ddd; border-radius: 8px; margin-bottom: 12px; font-size: 14px; }
        .nav-tabs { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
        .tab-btn { background: #e2d3ed; color: #6f2c91; border: none; padding: 9px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; white-space: nowrap; }
        .tab-btn.active { background: #6f2c91; color: #fff; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    </style>
</head>
<body>

    <!-- Admin Login Screen (Security Check) -->
    <div id="admin-login-modal" class="modal">
        <div class="card" style="width: 90%; max-width: 380px;">
            <h3 style="color: #6f2c91; margin-bottom: 15px;"><i class="fa-solid fa-lock"></i> এডমিন প্যানেল লগইন</h3>
            <form onsubmit="handleAdminLogin(event)">
                <div class="form-group" style="margin-bottom:10px;">
                    <label style="font-size:12px; font-weight:bold;">ইউজারনেম</label>
                    <input type="text" id="admin-user" class="form-control" required placeholder="ইউজারনেম দিন">
                </div>
                <div class="form-group" style="margin-bottom:10px;">
                    <label style="font-size:12px; font-weight:bold;">পাসওয়ার্ড</label>
                    <input type="password" id="admin-pass" class="form-control" required placeholder="পাসওয়ার্ড দিন">
                </div>
                <button type="submit" class="btn">লগইন করুন</button>
            </form>
        </div>
    </div>

    <div class="admin-container hidden" id="admin-main-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h2 style="color: #6f2c91;"><i class="fa-solid fa-user-shield"></i> এডমিন কন্ট্রোল প্যানেল</h2>
            <button onclick="adminLogout()" style="background:#ff3366; color:#fff; border:none; padding:6px 12px; border-radius:6px; cursor:pointer; font-weight:bold; font-size:12px;">লগআউট</button>
        </div>

        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchAdminTab('orders', this)">অর্ডারসমূহ</button>
            <button class="tab-btn" onclick="switchAdminTab('users', this)">রেজিস্টার্ড ইউজার</button>
            <button class="tab-btn" onclick="switchAdminTab('products', this)">প্রোডাক্ট (Ecom)</button>
            <button class="tab-btn" onclick="switchAdminTab('packages', this)">টপআপ প্যাকেজ</button>
            <button class="tab-btn" onclick="switchAdminTab('notices', this)">নোটিশ বোর্ড</button>
        </div>

        <!-- Orders Section -->
        <div id="admin-section-orders" class="card">
            <h3>সকল কাস্টমার অর্ডার</h3>
            <div id="admin-orders-container" style="margin-top: 10px;">লোড হচ্ছে...</div>
        </div>

        <!-- Users Section -->
        <div id="admin-section-users" class="card hidden">
            <h3>রেজিস্টার্ড ইউজার তালিকা</h3>
            <div id="admin-users-container" style="margin-top: 10px;">লোড হচ্ছে...</div>
        </div>

        <!-- Products Section (E-commerce with Image File Manager) -->
        <div id="admin-section-products" class="card hidden">
            <h3>নতুন ই-কমার্স প্রোডাক্ট যোগ করুন</h3>
            <form onsubmit="addEcomProduct(event)">
                <input type="text" id="prod-title" class="form-control" placeholder="প্রোডাক্টের নাম (যেমন: শার্ট, প্যান্ট)" required>
                <input type="number" id="prod-price" class="form-control" placeholder="মূল্য (৳)" required>
                <textarea id="prod-details" class="form-control" placeholder="প্রোডাক্টের বিবরণ (সাইজ, কালার ইত্যাদি)"></textarea>
                <label style="font-size: 12px; font-weight: bold; display: block; margin-bottom: 4px;">প্রোডাক্টের ছবি (ফাইল ম্যানেজার থেকে নির্বাচন করুন)</label>
                <input type="file" id="prod-file" class="form-control" accept="image/*" required>
                <button type="submit" class="btn">প্রোডাক্ট পাবলিশ করুন</button>
            </form>
        </div>

        <!-- Packages Section -->
        <div id="admin-section-packages" class="card hidden">
            <h3>গেম টপআপ প্যাকেজ যোগ করুন</h3>
            <form onsubmit="addPackage(event)">
                <input type="text" id="pkg-name" class="form-control" placeholder="প্যাকেজের নাম (যেমন: 115 Diamonds)" required>
                <input type="number" id="pkg-price" class="form-control" placeholder="মূল্য (৳)" required>
                <select id="pkg-category" class="form-control">
                    <option value="ff">Free Fire</option>
                    <option value="efootball">eFootball</option>
                </select>
                <button type="submit" class="btn">প্যাকেজ যোগ করুন</button>
            </form>
        </div>

        <!-- Notices Section (Text + Image File Manager) -->
        <div id="admin-section-notices" class="card hidden">
            <h3>নোটিশ বোর্ড আপডেট</h3>
            <form onsubmit="updateNotice(event)">
                <textarea id="notice-text" class="form-control" placeholder="নোটিশের লেখা লিখুন..." required></textarea>
                <label style="font-size: 12px; font-weight: bold; display: block; margin-bottom: 4px;">নোটিশের ছবি (ফাইল ম্যানেজার থেকে - ঐচ্ছিক)</label>
                <input type="file" id="notice-file" class="form-control" accept="image/*">
                <button type="submit" class="btn">নোটিশ পাবলিশ করুন</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyACc83rBZjnoZ8l-pZFIRqSs-fyVoiN6ck",
            authDomain: "mihadx-pro-bd.firebaseapp.com",
            projectId: "mihadx-pro-bd",
            storageBucket: "mihadx-pro-bd.firebasestorage.app",
            messagingSenderId: "478391400367",
            appId: "1:478391400367:web:86012d35014ee7350a215a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Simple Admin Credentials Check
        window.handleAdminLogin = (e) => {
            e.preventDefault();
            const u = document.getElementById('admin-user').value.trim();
            const p = document.getElementById('admin-pass').value.trim();
            if(u === 'ISMAIL' && p === 'ISMAIL9191') {
                sessionStorage.setItem('isAdminLoggedIn', 'true');
                document.getElementById('admin-login-modal').classList.add('hidden');
                document.getElementById('admin-main-content').classList.remove('hidden');
                loadAdminOrders();
            } else {
                alert('ভুল ইউজারনেম বা পাসওয়ার্ড!');
            }
        };

        if(sessionStorage.getItem('isAdminLoggedIn') === 'true') {
            document.getElementById('admin-login-modal').classList.add('hidden');
            document.getElementById('admin-main-content').classList.remove('hidden');
            loadAdminOrders();
        }

        window.adminLogout = () => {
            sessionStorage.removeItem('isAdminLoggedIn');
            location.reload();
        };

        window.switchAdminTab = (tabName, btn) => {
            document.querySelectorAll('.admin-container > .card').forEach(c => c.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            if(tabName === 'orders') {
                document.getElementById('admin-section-orders').classList.remove('hidden');
                loadAdminOrders();
            } else if(tabName === 'users') {
                document.getElementById('admin-section-users').classList.remove('hidden');
                loadAdminUsers();
            } else if(tabName === 'products') {
                document.getElementById('admin-section-products').classList.remove('hidden');
            } else if(tabName === 'packages') {
                document.getElementById('admin-section-packages').classList.remove('hidden');
            } else if(tabName === 'notices') {
                document.getElementById('admin-section-notices').classList.remove('hidden');
            }
        };

        // Helper to convert uploaded file to Base64 so it works directly without storage rules issues
        const convertFileToBase64 = (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        };

        function loadAdminOrders() {
            const container = document.getElementById('admin-orders-container');
            onSnapshot(collection(db, "orders"), (snapshot) => {
                if(snapshot.empty) return container.innerHTML = '<p>কোনো অর্ডার নেই।</p>';
                let html = '';
                snapshot.forEach(docSnap => {
                    let ord = docSnap.data();
                    let id = docSnap.id;
                    html += `
                        <div style="border: 1px solid #ddd; padding: 10px; border-radius: 8px; margin-bottom: 8px; background:#fafafc;">
                            <p><strong>ID:</strong> #${ord.id || id}</p>
                            <p><strong>Item:</strong> ${ord.itemName}</p>
                            <p><strong>Price:</strong> ৳${ord.price}</p>
                            <p><strong>User:</strong> ${ord.userEmail}</p>
                            <p><strong>Status:</strong> <span style="color:orange; font-weight:bold;">${ord.status}</span></p>
                            <button class="btn" style="background:#00b894; padding:6px; font-size:12px; margin-top:4px;" onclick="updateStatus('${id}', 'Completed')">Complete</button>
                            <button class="btn" style="background:#ff3366; padding:6px; font-size:12px; margin-top:4px;" onclick="updateStatus('${id}', 'Cancelled')">Cancel</button>
                        </div>
                    `;
                });
                container.innerHTML = html;
            });
        }

        window.updateStatus = async (id, status) => {
            await updateDoc(doc(db, "orders", id), { status });
            alert('অর্ডার আপডেট হয়েছে!');
        };

        async function loadAdminUsers() {
            const container = document.getElementById('admin-users-container');
            container.innerHTML = '<p>লোড হচ্ছে...</p>';
            const snap = await getDocs(collection(db, "users"));
            if(snap.empty) return container.innerHTML = '<p>কোনো ইউজার নেই।</p>';
            let html = '';
            snap.forEach(docSnap => {
                let u = docSnap.data();
                html += `
                    <div style="border: 1px solid #ddd; padding: 10px; border-radius: 8px; margin-bottom: 8px;">
                        <p><strong>নাম:</strong> ${u.name || 'নাম নেই'}</p>
                        <p><strong>ইমেইল:</strong> ${u.email}</p>
                        <p><strong>ফোন:</strong> ${u.phone || 'N/A'}</p>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        window.addEcomProduct = async (e) => {
            e.preventDefault();
            const title = document.getElementById('prod-title').value.trim();
            const price = Number(document.getElementById('prod-price').value);
            const details = document.getElementById('prod-details').value.trim();
            const fileInput = document.getElementById('prod-file').files[0];

            let imageUrl = '';
            if(fileInput) {
                imageUrl = await convertFileToBase64(fileInput);
            }

            await addDoc(collection(db, "products"), { title, price, details, image: imageUrl });
            alert('প্রোডাক্ট সফলভাবে যোগ করা হয়েছে!');
            e.target.reset();
        };

        window.addPackage = async (e) => {
            e.preventDefault();
            const name = document.getElementById('pkg-name').value.trim();
            const price = Number(document.getElementById('pkg-price').value);
            const category = document.getElementById('pkg-category').value;

            await addDoc(collection(db, "packages"), { name, price, category });
            alert('প্যাকেজ যোগ করা হয়েছে!');
            e.target.reset();
        };

        window.updateNotice = async (e) => {
            e.preventDefault();
            const text = document.getElementById('notice-text').value.trim();
            const fileInput = document.getElementById('notice-file').files[0];

            let imageUrl = '';
            if(fileInput) {
                imageUrl = await convertFileToBase64(fileInput);
            }

            await addDoc(collection(db, "notices"), { text, image: imageUrl, createdAt: serverTimestamp() });
            alert('নোটিশ আপডেট হয়েছে!');
            e.target.reset();
        };
    </script>
</body>
</html>
