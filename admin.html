<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Mihadx BD</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="admin-body">
    <div class="admin-wrapper" id="admin-wrapper">
        <aside class="admin-sidebar">
            <h2><i class="fa-solid fa-shield-halved"></i> Mihadx Admin</h2>
            <ul>
                <li><a href="#" class="active" data-tab="orders"><i class="fa-solid fa-receipt"></i> Orders & bKash Verify</a></li>
                <li><a href="#" data-tab="packages"><i class="fa-solid fa-box"></i> Top-Up Packages</a></li>
                <li><a href="#" data-tab="products"><i class="fa-solid fa-store"></i> Products</a></li>
            </ul>
        </aside>
        <main class="admin-main">
            <header class="admin-header">
                <span id="admin-user-email">Checking admin authorization...</span>
                <button id="admin-logout" class="btn-logout">Logout</button>
            </header>
            <div id="admin-content" class="admin-content-area">
                <h3>স্বাগতম অ্যাডমিন প্যানেলে!</h3>
                <p>এখান থেকে আপনি বিকাশ পেমেন্ট ভেরিফাই এবং অর্ডার ম্যানেজ করতে পারবেন।</p>
            </div>
        </main>
    </div>
    <script type="module" src="js/dashboard.js"></script>
</body>
</html>
